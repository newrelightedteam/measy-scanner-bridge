<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect x="0" y="0" width="1024" height="1024" rx="226" fill="url(#bg)"/>

  <!-- Document -->
  <g filter="url(#soft)">
    <rect x="317" y="236" width="390" height="500" rx="28" fill="#FFFFFF"/>
    <rect x="317" y="236" width="390" height="500" rx="28" fill="none" stroke="#E2E8F0" stroke-width="4"/>
  </g>

  <!-- Text lines on document -->
  <rect x="367" y="322" width="290" height="22" rx="11" fill="#CBD5E1"/>
  <rect x="367" y="372" width="290" height="22" rx="11" fill="#CBD5E1"/>
  <rect x="367" y="422" width="220" height="22" rx="11" fill="#CBD5E1"/>
  <rect x="367" y="486" width="290" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="367" y="522" width="290" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="367" y="558" width="290" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="367" y="594" width="180" height="16" rx="8" fill="#E2E8F0"/>

  <!-- Scan beam -->
  <rect x="277" y="470" width="470" height="46" fill="url(#beam)"/>

  <!-- Scanner base -->
  <g filter="url(#soft)">
    <path d="M247 738 L777 738 L737 838 Q729 858 707 858 L317 858 Q295 858 287 838 Z" fill="#0F172A"/>
  </g>
  <rect x="207" y="700" width="610" height="60" rx="18" fill="#1E293B"/>
  <rect x="207" y="700" width="610" height="60" rx="18" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Scanner light strip -->
  <rect x="357" y="722" width="310" height="16" rx="8" fill="#38BDF8"/>

  <!-- Status dot -->
  <circle cx="742" cy="730" r="10" fill="#4ADE80"/>
</svg>
